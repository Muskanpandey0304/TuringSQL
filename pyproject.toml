[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turingsql"
version = "0.1.0"
description = "Fine-tuned text-to-SQL, served on TuringServe, evaluated on a private Olist benchmark"
requires-python = ">=3.10"
license = "MIT"
dependencies = []        # pinned in requirements.txt; torch is installed separately

[tool.setuptools.packages.find]
include = ["turingsql*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["turingsql"]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: loads a real model or takes more than 30 seconds",
  "gpu: needs a CUDA GPU",
]
